<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronaz Games</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .score {
      font-size: 40px;
      color: gold;
      margin-bottom: 35px;
    }

    button {
      padding: 25px 40px;
      font-size: 22px;
      border: none;
      border-radius: 20px;
      background: gold;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.95);
    }

    .small {
      margin-top: 20px;
      opacity: 0.7;
    }
  </style>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <div class="container">
    <h1>🔥 Ronaz Games</h1>

    <div class="score">
      <span id="score">0</span> Coins
    </div>

    <button onclick="tap()">TAP +1</button>

    <div class="small">
      Your progress is saved automatically
    </div>
  </div>

  <script>
    let score = parseInt(localStorage.getItem("score") || "0");

    document.getElementById("score").innerText = score;

    function tap() {
      score++;

      document.getElementById("score").innerText = score;

      localStorage.setItem("score", score);
    }

    // Telegram Mini App
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>

</body>
</html>
