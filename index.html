

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ronaz Games</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    .container {
      margin-top: 80px;
    }

    .score {
      font-size: 40px;
      margin: 20px 0;
      color: gold;
    }

    button {
      padding: 25px 40px;
      font-size: 22px;
      border: none;
      border-radius: 20px;
      background: gold;
      cursor: pointer;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.95);
    }

    .small {
      margin-top: 20px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🔥 Ronaz Games</h1>

    <div class="score">
      <span id="score">0</span> Coins
    </div>

    <button onclick="tap()">TAP +1</button>

    <div class="small">
      Your progress is saved automatically
    </div>
  </div>

  <script>
    let score = localStorage.getItem("score");

    if (!score) {
      score = 0;
    } else {
      score = parseInt(score);
    }

    document.getElementById("score").innerText = score;
<script>

  let score = 0;

  // 👇 اینجا بذار
  async function saveScore(score, userId) {
    await supabase.from("users").upsert({
      id: userId,
      score: score
    });
  }

  async function loadScore(userId) {
    let { data } = await supabase
      .from("users")
      .select("*")
      .eq("id", userId)
      .single();

    return data?.score || 0;
  }
async function tap() {
  score++;

  document.getElementById("score").innerText = score;

  await saveScore(score, tgUserId);
}
</script>

</html>
