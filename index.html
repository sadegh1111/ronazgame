<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronaz Game</title>

<style>
body{
background:#121212;
color:white;
font-family:Arial;
text-align:center;
margin-top:60px;
}

#coin{
font-size:70px;
cursor:pointer;
}

#coins{
font-size:35px;
margin:20px;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
}
</style>

</head>

<body>

<h1>🎮 Ronaz Game</h1>

<div id="coins">🪙 0</div>

<div id="coin">
🪙
</div>

<script>

let coins=0;

document.getElementById("coin").onclick=function(){

coins++;

document.getElementById("coins").innerHTML="🪙 "+coins;

}

</script>

</body>
</html>
